name: Equalyze CI/CD Fairness Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  fairness_audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy
        # In a real environment, you'd install the SDK from PyPI: pip install equalyze
        pip install requests

    - name: Run Model Prediction Step
      run: |
        python demo-integration/model/generate_predictions.py
        
    - name: Execute Equalyze Fairness Audit
      env:
        # Map your repository secret to the expected environment variable
        EQUALYZE_API_KEY: ${{ secrets.EQUALYZE_API_KEY }}
        EQUALYZE_BASE_URL: "https://equalyze-frontend-1085178935109.us-central1.run.app/api/v1"
        DATASET_PATH: predictions.csv
      run: |
        # Simulate running the SDK via the simulation script for the demo
        python demo-integration/ci_cd_simulation.py
