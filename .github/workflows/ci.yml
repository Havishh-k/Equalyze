name: Equalyze CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend: Python Tests + Lint ─────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest ruff

      - name: Lint (Ruff)
        run: ruff check api/ --select E,F,W --ignore E501

      - name: Run unit tests
        run: pytest api/tests/ -v --tb=short
        env:
          GEMINI_API_KEY: "test-key"
          ENVIRONMENT: "test"

  # ── Frontend: TypeScript + Lint ──────────────
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

  # ── Docker Build Validation ─────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f api/Dockerfile -t equalyze-api:test .

      - name: Build Frontend image
        run: docker build -f frontend/Dockerfile -t equalyze-frontend:test ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
